packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  '@opencvjs/web': 5.0.0-release.2
  '@types/node': ^24
  drop.that: ^0.1.1
  jspdf: ^4.2.1
  tesseract.js: ^7.0.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
allowBuilds:
  core-js: true
  tesseract.js: true
